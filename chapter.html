            ]
        };

        let language = localStorage.getItem("mhLanguage") || "ar";
        let questionIndex = 0;
        let answered = false;

        const lessonsContainer = document.getElementById("lessons");
        const languageButton = document.getElementById("languageButton");

        function renderLessons() {

            lessonsContainer.innerHTML = "";

            lessons[language].forEach((lesson, index) => {

                const card = document.createElement("div");
                card.className = "card lesson-card";

                const title = document.createElement("h2");
                title.textContent = lesson.title;

                const content = document.createElement("div");
                content.innerHTML = lesson.content;

                card.appendChild(title);
                card.appendChild(content);

                lessonsContainer.appendChild(card);

            });

        }

        function renderQuestion() {

            answered = false;

            const current = questions[language][questionIndex];

            document.getElementById("questionText").textContent =
                (language === "ar" ? "السؤال " : "Question ") +
                (questionIndex + 1) + ": " + current.q;

            const optionsContainer =
                document.getElementById("quizOptions");

            optionsContainer.innerHTML = "";

            current.options.forEach((option, index) => {

                const label = document.createElement("label");
                label.className = "quiz-option";

                const input = document.createElement("input");
                input.type = "radio";
                input.name = "quizAnswer";
                input.value = index;

                label.appendChild(input);
                label.appendChild(document.createTextNode(option));

                optionsContainer.appendChild(label);

            });

            document.getElementById("quizResult").textContent = "";
            document.getElementById("nextButton").style.display = "none";
            document.getElementById("checkButton").style.display = "inline-block";

        }

        function applyLanguage() {

            document.documentElement.lang = language;
            document.documentElement.dir =
                language === "ar" ? "rtl" : "ltr";

            document.getElementById("mainTitle").textContent =
                language === "ar" ? "محاسبة التكاليف" : "Cost Accounting";

            document.getElementById("mainSubtitle").textContent =
                language === "ar"
                ? "الفصل الأول: مفهوم التكاليف وتبويباتها"
                : "Chapter 1: Cost Concepts and Classifications";

            document.getElementById("quizTitle").textContent =
                language === "ar" ? "اختبر معلوماتك" : "Test Your Knowledge";

            document.getElementById("checkButton").textContent =
                language === "ar" ? "تأكيد الإجابة" : "Check Answer";

            document.getElementById("nextButton").textContent =
                language === "ar" ? "السؤال التالي" : "Next Question";

            document.getElementById("backButton").textContent =
                language === "ar" ? "العودة إلى المواد" : "Back to Courses";

            languageButton.textContent =
                language === "ar" ? "English" : "العربية";

            renderLessons();
            renderQuestion();

        }

        languageButton.addEventListener("click", function() {

            language = language === "ar" ? "en" : "ar";

            localStorage.setItem("mhLanguage", language);

            applyLanguage();

        });

        document.getElementById("checkButton").addEventListener("click", function() {

            if (answered) return;

            const selected = document.querySelector(
                'input[name="quizAnswer"]:checked'
            );

            if (!selected) {

                document.getElementById("quizResult").textContent =
                    language === "ar"
                    ? "من فضلك اختر إجابة أولاً."
                    : "Please select an answer first.";

                return;
            }

            answered = true;

            const correct = questions[language][questionIndex].answer;
            const result = document.getElementById("quizResult");

            if (Number(selected.value) === correct) {

                result.textContent =
                    language === "ar"
                    ? "إجابة صحيحة! أحسنت."
                    : "Correct answer! Well done.";

                result.style.color = "green";

            } else {

                result.textContent =
                    language === "ar"
                    ? "إجابة غير صحيحة. راجع الشرح وحاول مرة أخرى في المراجعة."
                    : "Incorrect answer. Review the lesson.";

                result.style.color = "red";

            }

            document.getElementById("nextButton").style.display = "inline-block";
            document.getElementById("checkButton").style.display = "none";

        });

        document.getElementById("nextButton").addEventListener("click", function() {

            questionIndex++;

            if (questionIndex >= questions[language].length) {

                questionIndex = 0;

                document.getElementById("quizResult").textContent =
                    language === "ar"
                    ? "انتهى الاختبار! يمكنك إعادة المحاولة."
                    : "Quiz completed! You can try again.";

            }

            renderQuestion();

        });

        applyLanguage();

    </script>

</body>
</html>
