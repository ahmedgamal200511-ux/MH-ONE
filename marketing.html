questions:[

const links = document.getElementById("chapterLinks");
const content = document.getElementById("content");
const STORAGE_KEY = "mh_one_marketing_completed_v2";

let completed = [];
try {
 completed = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
 if (!Array.isArray(completed)) completed = [];
} catch(e) { completed = []; }

let current = 0;

function escapeHTML(value){
 return String(value).replace(/[&<>"']/g, ch => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[ch]));
}

function updateProgress(){
 const total = chapters.length;
 const count = completed.length;
 document.getElementById("progressText").textContent = count+" من "+total+" فصل";
 document.getElementById("progressFill").style.width = (count/total*100)+"%";
}

function render(){
 chapters.forEach((chapter,index)=>{
  const link=document.createElement("button");
  link.className="chapter-link";
  link.textContent=(index+1)+". "+chapter.title;
  link.onclick=()=>showChapter(index);
  links.appendChild(link);

  const section=document.createElement("section");
  section.className="chapter";
  section.id="chapter-"+index;

  let html=`
   <h2>${escapeHTML(chapter.title)}</h2>
   <p>${escapeHTML(chapter.intro)}</p>
   <div class="definition"><strong>هدف الفصل:</strong> افهم الفكرة العامة، ثم اربط التعريفات بالأمثلة والتطبيقات.</div>
  `;

  chapter.topics.forEach((topic,i)=>{
   html+=`<h3>${i+1}. ${escapeHTML(topic[0])}</h3><p>${escapeHTML(topic[1])}</p>`;
  });

  if(chapter.terms && chapter.terms.length){
   html+=`<h3>أهم المصطلحات</h3><ul>`;
   chapter.terms.forEach(term=>html+=`<li>${escapeHTML(term)}</li>`);
   html+=`</ul>`;
  }

  if(chapter.example){
   html+=`<div class="example"><strong>مثال تطبيقي:</strong><br>${escapeHTML(chapter.example)}</div>`;
  }

  if(chapter.compare){
   html+=`<div class="comparison"><strong>فرق مهم:</strong><br>${escapeHTML(chapter.compare)}</div>`;
  }

  if(chapter.questions && chapter.questions.length){
   html+=`<div class="quiz"><h3>اختبر فهمك</h3><p class="small">اختر الإجابة، وستظهر لك النتيجة والتفسير مباشرة.</p>`;
   chapter.questions.forEach((q,qIndex)=>{
    html+=`
     <div class="question">
      <strong>${qIndex+1}. ${escapeHTML(q[0])}</strong>
      <div id="options-${index}-${qIndex}"></div>
      <div class="feedback" id="feedback-${index}-${qIndex}"></div>
     </div>
    `;
   });
   html+=`<p id="score-${index}" class="feedback"></p></div>`;
  }

  html+=`
   <div class="summary">
    <strong>مهمة المذاكرة:</strong>
    حاول تلخيص الفصل في خمس نقاط من ذاكرتك قبل الانتقال للفصل التالي.
   </div>
   <div class="actions">
    <button class="btn secondary" onclick="previousChapter()" ${index===0?"disabled":""}>الفصل السابق</button>
    <button class="btn" id="complete-${index}" onclick="markComplete(${index})">
     ${completed.includes(index)?"تمت المذاكرة ✓":"تحديد الفصل كمكتمل"}
    </button>
    <button class="btn secondary" onclick="nextChapter()" ${index===chapters.length-1?"disabled":""}>الفصل التالي</button>
   </div>
  `;

  section.innerHTML=html;
  content.appendChild(section);

  if(chapter.questions){
   chapter.questions.forEach((q,qIndex)=>{
    const box=section.querySelector("#options-"+index+"-"+qIndex);
    q[1].forEach((option,optionIndex)=>{
     const button=document.createElement("button");
     button.className="option";
     button.textContent=option;
     button.onclick=()=>answerQuestion(index,qIndex,optionIndex);
     box.appendChild(button);
    });
   });
  }
 });
}

function showChapter(index){
 current=index;
 document.querySelectorAll(".chapter").forEach(el=>el.classList.remove("active"));
 document.querySelectorAll(".chapter-link").forEach(el=>el.classList.remove("active"));
 document.getElementById("chapter-"+index).classList.add("active");
 document.querySelectorAll(".chapter-link")[index].classList.add("active");
 window.scrollTo({top:0,behavior:"smooth"});
}

function answerQuestion(chapterIndex,questionIndex,selected){
 const question=chapters[chapterIndex].questions[questionIndex];
 const box=document.getElementById("options-"+chapterIndex+"-"+questionIndex);
 const feedback=document.getElementById("feedback-"+chapterIndex+"-"+questionIndex);
 const buttons=box.querySelectorAll("button");

 buttons.forEach((button,i)=>{
  button.disabled=true;
  if(i===question[2]) button.classList.add("correct");
  if(i===selected && selected!==question[2]) button.classList.add("wrong");
 });

 if(selected===question[2]){
  feedback.textContent="إجابة صحيحة! "+question[3];
 }else{
  feedback.textContent="الإجابة الصحيحة: "+question[1][question[2]]+". "+question[3];
 }
 updateQuizScore(chapterIndex);
}

function updateQuizScore(chapterIndex){
 const questions=chapters[chapterIndex].questions;
 let answered=0,correct=0;
 questions.forEach((q,i)=>{
  const box=document.getElementById("options-"+chapterIndex+"-"+i);
  if(box.querySelector("button:disabled")){
   answered++;
   if(box.querySelector(".option.correct") &&
      box.querySelectorAll(".option.correct").length===1 &&
      box.querySelector(".option.correct")===box.children[q[2]]){
    const selectedWrong=box.querySelector(".option.wrong");
    if(!selectedWrong) correct++;
   }
  }
 });
 const score=document.getElementById("score-"+chapterIndex);
 score.textContent="نتيجتك حتى الآن: "+correct+" من "+answered+" سؤال تمت الإجابة عنه.";
}

function markComplete(index){
 if(!completed.includes(index)){
  completed.push(index);
  localStorage.setItem(STORAGE_KEY,JSON.stringify(completed));
 }
 document.getElementById("complete-"+index).textContent="تمت المذاكرة ✓";
 updateProgress();
}

function nextChapter(){
 if(current<chapters.length-1) showChapter(current+1);
}
function previousChapter(){
 if(current>0) showChapter(current-1);
}

render();
showChapter(0);
updateProgress();
</script>
</body>
</html>
